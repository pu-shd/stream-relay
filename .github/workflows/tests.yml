name: Tests

# Everything here runs offline: no Azure credentials, no cloud access, no spend. The mock
# `az` shim makes the deployment scripts fully testable without a subscription, which is
# the only reason a cold-standby project can have meaningful CI at all.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: bash syntax check
        run: |
          for f in scripts/*.sh scripts/lib/*.sh tests/mock-az/bin/az tests/mock-az/run.sh \
                   tests/integration/*.sh; do
            bash -n "$f" || exit 1
            echo "ok  $f"
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh scripts/lib/*.sh tests/mock-az/run.sh

      - name: Reject bash 4+ constructs
        # macOS ships bash 3.2 and macOS is the primary platform, so these must not creep
        # back in. Ubuntu's bash 5 would happily run them and hide the breakage.
        run: |
          if grep -nE '\$\{[A-Za-z_]+(\^\^|,,)\}|mapfile|readarray|declare -A' \
               scripts/*.sh scripts/lib/*.sh | grep -v 'bash 4+'; then
            echo "::error::bash 4+ construct found; macOS ships bash 3.2"
            exit 1
          fi
          echo "no bash 4+ constructs"

  bicep:
    name: Bicep compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: az bicep build
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          echo "main.bicep and all modules compile"

      - name: Assert the load-bearing Front Door settings are present
        # Each of these prevents a specific, expensive failure. A future edit that drops
        # one would otherwise pass every other check silently.
        run: |
          fd=infra/modules/frontdoor.bicep
          grep -q "autoGeneratedDomainNameLabelScope: 'TenantReuse'" "$fd" \
            || { echo "::error::hostname hash reuse not pinned — a redeploy would change the hostname and break every vlc.xml"; exit 1; }
          grep -q "queryStringCachingBehavior: 'IgnoreSpecifiedQueryStrings'" "$fd" \
            || { echo "::error::cache key does not ignore ?session — origin egress would roughly double"; exit 1; }
          grep -q "queryParameters: 'session'" "$fd" \
            || { echo "::error::the ignored query parameter is not 'session'"; exit 1; }
          grep -q "cacheBehavior: 'OverrideAlways'" "$fd" \
            || { echo "::error::no explicit cache TTL — Front Door would assign a random 1-3 day TTL"; exit 1; }
          grep -q "RateLimitRule" "$fd" \
            || { echo "::error::no WAF rate limit — public HLS egress would be unbounded"; exit 1; }
          echo "all load-bearing Front Door settings present"

      - name: Assert the public IP is static
        run: |
          grep -q "publicIPAllocationMethod: 'Static'" infra/modules/network.bicep \
            || { echo "::error::public IP is not static — publishers embed it and would break on VM restart"; exit 1; }
          echo "public IP is static"

      - name: Assert federated credentials are created serially
        # Azure rejects concurrent FIC writes under one managed identity with
        # ConcurrentFederatedIdentityCredentialsWritesForSingleManagedIdentity. Two parallel
        # loops hit exactly that during the first real deployment, so the credentials are
        # flattened into ONE @batchSize(1) loop. Both properties are load-bearing.
        run: |
          id=infra/modules/identity.bicep
          grep -q '@batchSize(1)' "$id" \
            || { echo "::error::federated credentials are not serialized; Azure rejects concurrent FIC writes"; exit 1; }
          n=$(grep -c "federatedIdentityCredentials@" "$id")
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one federatedIdentityCredentials loop, found $n."
            echo "::error::Separate per-kind loops deploy in parallel and Azure rejects them."
            exit 1
          fi
          echo "federated credentials are created one at a time"

      - name: Assert CI cannot be granted role-assignment rights
        # The whole point of the identity split: creating role assignments needs User Access
        # Administrator, and a workflow holding that can grant itself anything.
        run: |
          grep -q "param deployRoleAssignments bool = false" infra/main.bicep \
            || { echo "::error::deployRoleAssignments must default to false (the CI posture)"; exit 1; }
          for m in acr keyvault identity; do
            grep -q "deployRoleAssignments" "infra/modules/$m.bicep" \
              || { echo "::error::infra/modules/$m.bicep creates RBAC without gating it"; exit 1; }
          done
          grep -q "'Contributor'\|contributorRoleId" infra/modules/identity.bicep \
            || { echo "::error::CI identity is never granted Contributor; deployments would fail"; exit 1; }
          if grep -qE "userAccessAdministrator|18d7d88d-d35e-4fb5-a5c3-7773c20a72d9" infra/modules/*.bicep; then
            echo "::error::a module grants User Access Administrator — that is an escalation path"
            exit 1
          fi
          echo "role-assignment creation is gated and CI cannot escalate"

  mock-az:
    name: Deployment scripts (mock az)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the offline suite
        run: tests/mock-az/run.sh

  integration:
    name: SRT to HLS integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The suite needs the generated mediamtx.yml.tmpl from the config repo. Without a
      # token it exits 77 ("not configured") rather than failing, so a missing secret
      # degrades to a skip instead of a red build.
      - name: Checkout stream-relay-config
        id: cfg
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: pu-shd/stream-relay-config
          path: config-checkout
          token: ${{ secrets.STREAM_RELAY_CONFIG_READ_TOKEN || github.token }}

      - name: Run SRT -> MediaMTX -> HLS assertions
        run: |
          if [ -d config-checkout/orfe ]; then
            RELAY_CONFIG_DIR="$PWD/config-checkout/orfe" tests/integration/test-publish-to-hls.sh
          else
            echo "::warning::stream-relay-config unavailable; integration suite skipped"
          fi
