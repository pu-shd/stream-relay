name: Tests

# Everything here runs offline: no Azure credentials, no cloud access, no spend. The mock
# `az` shim makes the deployment scripts fully testable without a subscription, which is
# the only reason a cold-standby project can have meaningful CI at all.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Shell lint and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: bash syntax check
        run: |
          for f in scripts/*.sh scripts/lib/*.sh tests/mock-az/bin/az tests/mock-az/run.sh \
                   tests/integration/*.sh tests/host/run.sh host/*.sh host/bin/*.sh; do
            bash -n "$f" || exit 1
            echo "ok  $f"
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh scripts/lib/*.sh tests/mock-az/run.sh \
            tests/host/run.sh host/*.sh host/bin/*.sh

      - name: Reject bash 4+ constructs
        # macOS ships bash 3.2 and macOS is the primary platform, so these must not creep
        # back in. Ubuntu's bash 5 would happily run them and hide the breakage.
        run: |
          if grep -nE '\$\{[A-Za-z_]+(\^\^|,,)\}|mapfile|readarray|declare -A' \
               scripts/*.sh scripts/lib/*.sh host/*.sh host/bin/*.sh \
               | grep -v 'bash 4+'; then
            echo "::error::bash 4+ construct found; macOS ships bash 3.2"
            exit 1
          fi
          echo "no bash 4+ constructs"

  bicep:
    name: Bicep compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: az bicep build
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          echo "main.bicep and all modules compile"

      - name: Assert the load-bearing adoption properties hold
        # Each prevents a specific, expensive failure. A future edit that drops one would
        # otherwise pass every other check silently.
        run: |
          m=infra/main.bicep

          # THE critical one. The VM, its vault and its network already existed; declaring
          # an existing VM invites Azure to replace it, and replacement destroys the disks.
          grep -qE "resource vm 'Microsoft.Compute/virtualMachines@[^']+' existing" "$m" \
            || { echo "::error::the VM is not referenced as existing - a deploy could replace it and destroy its disks"; exit 1; }
          grep -qE "resource keyVault 'Microsoft.KeyVault/vaults@[^']+' existing" "$m" \
            || { echo "::error::the Key Vault is not referenced as existing"; exit 1; }

          # The NSG is the access control now that there is no WAF.
          for rule in AllowSrtIngest AllowHlsDelivery AllowAcmeHttp; do
            grep -q "name: '$rule'" "$m" \
              || { echo "::error::missing NSG rule $rule"; exit 1; }
          done

          # No inbound administrative path unless explicitly asked for. Administration is
          # az vm run-command over the control plane.
          grep -q "enableSsh ?" "$m" \
            || { echo "::error::port 22 is not gated behind enableSsh"; exit 1; }

          # The retired delivery plane must not creep back: it cost a storage account, an
          # azcopy mirror, a Front Door profile and a WAF policy to serve ten campus TVs.
          for gone in frontdoor storage network vm identity acr; do
            if [ -e "infra/modules/$gone.bicep" ]; then
              echo "::error::infra/modules/$gone.bicep is back; that module was retired with the topology change"
              exit 1
            fi
          done
          if grep -qiE "frontdoor|storageAccountName|azcopy" "$m"; then
            echo "::error::main.bicep still references the retired delivery plane"
            exit 1
          fi

          echo "adoption properties hold: VM and vault existing, NSG rules present, no CDN plane"

      - name: Assert CI cannot be granted role-assignment rights
        # The whole point of the identity split: creating role assignments needs User Access
        # Administrator, and a workflow holding that can grant itself anything.
        run: |
          grep -q "param deployRoleAssignments bool = false" infra/main.bicep \
            || { echo "::error::deployRoleAssignments must default to false (the CI posture)"; exit 1; }
          # Every role assignment in the template must be gated behind that flag.
          if grep -q "Microsoft.Authorization/roleAssignments" infra/main.bicep \
             && ! grep -q "if (deployRoleAssignments)" infra/main.bicep; then
            echo "::error::main.bicep creates a role assignment without gating it on deployRoleAssignments"
            exit 1
          fi
          if grep -qE "userAccessAdministrator|18d7d88d-d35e-4fb5-a5c3-7773c20a72d9" infra/modules/*.bicep; then
            echo "::error::a module grants User Access Administrator — that is an escalation path"
            exit 1
          fi
          echo "role-assignment creation is gated and CI cannot escalate"

  host:
    name: Host layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run the offline suite
        # Exercises verify-installed.sh against a fake install tree. The drift check is
        # the only thing keeping host/ honest, so it is run rather than assumed.
        run: tests/host/run.sh

  watchdog:
    name: Watchdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run the offline suite
        # stdlib unittest, no pytest and no network. The watchdog decides whether anyone
        # is told the wall is dark, so it is run against synthetic inputs rather than
        # grepped.
        run: python3 tests/watchdog/test_watchdog.py
      - name: The image builds
        run: docker build -q -t relay-watchdog:ci docker/watchdog

  maintenance:
    name: Maintenance slate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: The switch tool's offline suite
        # Against a model of the rendered nginx rules, so each test asks what a VIEWER is
        # served, not whether a file was written.
        run: python3 tests/maintenance/test_maintenance.py
      - name: The slate builds, and streams what the channels advertise
        # Built and RUN, not just built: the first version looped an MPEG-TS clip, which
        # built fine and produced one 30-second segment instead of 4-second ones.
        run: |
          set -euo pipefail
          docker build -q -t relay-slate:ci docker/slate
          docker volume create slate-ci >/dev/null
          docker run --rm -v slate-ci:/slate alpine:3.22 chown 10002:10002 /slate
          docker run -d --name slate-ci -v slate-ci:/slate relay-slate:ci >/dev/null
          sleep 20
          out=$(docker run --rm -v slate-ci:/slate alpine:3.22 sh -c \
            'cat /slate/index.m3u8 /slate/main_stream.m3u8; ls /slate | grep -c "^slate_seg"')
          docker logs slate-ci 2>&1 | tail -5
          echo "$out"
          segs=$(echo "$out" | tail -1)
          [ "$segs" -ge 3 ] || { echo "::error::only $segs segments after 20s"; exit 1; }
          echo "$out" | grep -q 'CODECS="avc1.640028,mp4a.40.2"' \
            || { echo "::error::slate does not advertise High@4.0 + AAC"; exit 1; }
          echo "$out" | grep -q '^#EXT-X-TARGETDURATION:4$' \
            || { echo "::error::segments are not 4s"; exit 1; }
          seq=$(echo "$out" | grep -oE 'MEDIA-SEQUENCE:[0-9]+' | cut -d: -f2)
          [ "$seq" -gt 1000000000 ] \
            || { echo "::error::media sequence $seq is not epoch-based"; exit 1; }
          docker rm -f slate-ci >/dev/null

  mock-az:
    name: Deployment scripts (mock az)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run the offline suite
        run: tests/mock-az/run.sh

  integration:
    name: SRT to HLS integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The suite needs the generated mediamtx.yml.tmpl from the config repo. Without a
      # token it exits 77 ("not configured") rather than failing, so a missing secret
      # degrades to a skip instead of a red build.
      - name: Checkout stream-relay-config
        id: cfg
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        continue-on-error: true
        with:
          repository: pu-shd/stream-relay-config
          path: config-checkout
          token: ${{ secrets.STREAM_RELAY_CONFIG_READ_TOKEN || github.token }}

      - name: Run SRT -> MediaMTX -> HLS assertions
        run: |
          if [ -d config-checkout/orfe ]; then
            RELAY_CONFIG_DIR="$PWD/config-checkout/orfe" tests/integration/test-publish-to-hls.sh
          else
            echo "::warning::stream-relay-config unavailable; integration suite skipped"
          fi
